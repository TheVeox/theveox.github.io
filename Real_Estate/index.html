<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت فاکتور مالک</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" xintegrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Libraries for Excel, Zipping, and Local Storage -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
    
    <!-- Vazirmatn Font -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Base styles and theming inspired by shadcn/ui */
        :root {
            --background: 0 0% 100%;
            --foreground: 222.2 84% 4.9%;
            --card: 0 0% 100%;
            --card-foreground: 222.2 84% 4.9%;
            --popover: 0 0% 100%;
            --popover-foreground: 222.2 84% 4.9%;
            --primary: 222.2 47.4% 11.2%;
            --primary-foreground: 210 40% 98%;
            --secondary: 210 40% 96.1%;
            --secondary-foreground: 222.2 47.4% 11.2%;
            --muted: 210 40% 96.1%;
            --muted-foreground: 215.4 16.3% 46.9%;
            --accent: 210 40% 96.1%;
            --accent-foreground: 222.2 47.4% 11.2%;
            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 210 40% 98%;
            --border: 214.3 31.8% 91.4%;
            --input: 214.3 31.8% 91.4%;
            --ring: 222.2 84% 4.9%;
            --radius: 0.75rem; /* Increased radius for modern look */
        }

        .dark {
            --background: 224 71% 4%;
            --foreground: 210 40% 98%;
            --card: 224 71% 4%;
            --card-foreground: 210 40% 98%;
            --popover: 224 71% 4%;
            --popover-foreground: 210 40% 98%;
            --primary: 210 40% 98%;
            --primary-foreground: 222.2 47.4% 11.2%;
            --secondary: 217.2 32.6% 17.5%;
            --secondary-foreground: 210 40% 98%;
            --muted: 217.2 32.6% 17.5%;
            --muted-foreground: 215 20.2% 65.1%;
            --accent: 217.2 32.6% 17.5%;
            --accent-foreground: 210 40% 98%;
            --destructive: 0 62.8% 30.6%;
            --destructive-foreground: 210 40% 98%;
            --border: 217.2 32.6% 17.5%;
            --input: 217.2 32.6% 17.5%;
            --ring: 212.7 26.8% 83.9%;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: hsl(var(--secondary)); }
        ::-webkit-scrollbar-thumb { background: hsl(var(--border)); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: hsl(var(--muted-foreground)); }
        
        /* Motion & Animations */
        @media (prefers-reduced-motion: no-preference) {
            .modal-content, .toast {
                animation: scale-in 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            }
            .toast.fade-out {
                animation: slide-out 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }
        }
        @keyframes scale-in {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slide-out {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(20px); }
        }

        /* Hide scrollbar but keep functionality */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app" class="flex h-screen antialiased text-gray-800">
        <!-- Sidebar for Employers -->
        <aside class="w-72 flex-shrink-0 border-l border-gray-200 bg-white flex flex-col">
            <div class="h-16 flex items-center justify-between px-4 border-b border-gray-200 flex-shrink-0">
                <h1 class="text-lg font-bold text-gray-800">کارفرماها</h1>
                <button id="add-employer-btn" class="p-2 w-9 h-9 flex items-center justify-center rounded-lg hover:bg-gray-100 transition-colors" title="افزودن کارفرما جدید"><i class="fas fa-plus"></i></button>
            </div>
            <nav id="employers-list" class="flex-1 overflow-y-auto p-3 space-y-1"></nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="h-16 bg-white/80 backdrop-blur-sm border-b flex items-center justify-between px-6 flex-shrink-0">
                <div id="active-employer-header" class="flex items-center gap-3"></div>
                <div class="flex items-center gap-3">
                    <button id="export-excel-btn" class="px-4 py-2 text-sm font-medium text-black bg-white rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition-all disabled:opacity-50 border border-gray-300">خروجی اکسل</button>
                    <button id="export-html-btn" class="px-4 py-2 text-sm font-medium text-black bg-white rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition-all disabled:opacity-50 border border-gray-300">خروجی کارفرما (HTML)</button>
                </div>
            </header>

            <div class="flex-1 flex overflow-hidden">
                <!-- Items List -->
                <section class="flex-1 flex flex-col p-6">
                    <div class="mb-6 bg-white p-4 rounded-xl border border-gray-200">
                        <form id="item-form" class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
                            <input type="hidden" id="edit-item-id">
                            <div class="md:col-span-2"><label for="item-name" class="block text-sm font-medium text-gray-700 mb-1">نام آیتم</label><input type="text" id="item-name" placeholder="مثال: دستمزد نصب" required class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"></div>
                            <div><label for="item-amount" class="block text-sm font-medium text-gray-700 mb-1">مبلغ (ریال)</label><input type="text" id="item-amount" placeholder="مثال: ۱,۲۰۰,۰۰۰" required class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"></div>
                            <div><label for="item-type" class="block text-sm font-medium text-gray-700 mb-1">نوع</label><select id="item-type" class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"><option value="expense">هزینه</option><option value="received">دریافتی</option></select></div>
                            <div class="flex items-center gap-2">
                                <button type="submit" id="item-submit-btn" class="w-full h-10 px-4 py-2 text-sm font-medium text-black bg-white rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition-all border border-gray-300">افزودن آیتم</button>
                                <button type="button" id="cancel-edit-btn" class="hidden h-10 px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition-all border border-gray-300">انصراف</button>
                            </div>
                        </form>
                    </div>

                    <div class="flex-1 bg-white rounded-xl border border-gray-200 overflow-hidden flex flex-col">
                        <div class="overflow-x-auto overflow-y-auto flex-1 hide-scrollbar">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50/80 sticky top-0 backdrop-blur-sm">
                                    <tr>
                                        <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">نام آیتم</th>
                                        <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">مبلغ</th>
                                        <th scope="col" class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">نوع</th>
                                        <th scope="col" class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">پیوست</th>
                                        <th scope="col" class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">گزارش کارفرما</th>
                                        <th scope="col" class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">عملیات</th>
                                    </tr>
                                </thead>
                                <tbody id="items-list" class="bg-white divide-y divide-gray-200"></tbody>
                            </table>
                        </div>
                        <div id="empty-state" class="hidden text-center py-24 px-6"><h3 class="mt-4 text-sm font-semibold text-gray-900">بدون آیتم</h3><p class="mt-1 text-sm text-gray-500">برای شروع یک آیتم جدید اضافه کنید.</p></div>
                    </div>
                </section>

                <aside class="w-80 flex-shrink-0 border-r border-gray-200 bg-white p-6 flex flex-col gap-6">
                    <h2 class="text-xl font-bold">خلاصه حساب</h2>
                    <div id="summary-card" class="space-y-4"></div>
                    <div id="payment-profile-selector-container" class="pt-4 border-t border-gray-200">
                        <label for="payment-profile-select" class="text-md font-semibold mb-3 block">پروفایل پرداخت خروجی</label>
                        <select id="payment-profile-select" class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"></select>
                    </div>
                    <div class="mt-auto pt-6 border-t border-gray-200">
                        <h3 class="text-md font-semibold mb-3">تنظیمات پیشرفته</h3>
                        <div class="space-y-2">
                             <button id="manage-payment-profiles-btn" class="w-full px-4 py-2 text-sm font-medium text-black bg-white rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition-all border border-gray-300">مدیریت پروفایل‌های پرداخت</button>
                             <button id="backup-data-btn" class="w-full px-4 py-2 text-sm font-medium text-black bg-white rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition-all border border-gray-300">دریافت پشتیبان (JSON)</button>
                             <div class="bg-white border border-gray-300 rounded-lg">
                                <label class="w-full cursor-pointer text-center px-4 py-2 text-sm font-medium block hover:bg-gray-100 rounded-t-lg">
                                    بازیابی اطلاعات (JSON)
                                    <input type="file" id="restore-data-input" class="hidden" accept=".json">
                                </label>
                                <div class="border-t border-gray-300 px-4 py-2 text-sm">
                                    <label class="flex items-center gap-2 cursor-pointer">
                                        <input type="checkbox" id="merge-data-checkbox" class="rounded text-blue-600 focus:ring-blue-500">
                                        <span>ادغام با اطلاعات فعلی</span>
                                    </label>
                                </div>
                             </div>
                             <button id="delete-all-data-btn" class="w-full px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-all border border-transparent">پاک کردن تمام داده ها</button>
                        </div>
                    </div>
                </aside>
            </div>
        </main>
    </div>
    
    <!-- Modals & Toasts -->
    <div id="employer-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 transition-opacity duration-300">
        <div class="modal-content bg-white rounded-xl shadow-xl p-6 w-full max-w-md"><h3 id="employer-modal-title" class="text-lg font-bold mb-4">افزودن کارفرما</h3><form id="employer-form"><input type="hidden" id="employer-id"><div><label for="employer-name" class="block text-sm font-medium text-gray-700 mb-1">نام کارفرما</label><input type="text" id="employer-name" required class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 transition"></div><div class="mt-6 flex justify-end gap-3"><button type="button" id="cancel-employer-modal" class="px-4 py-2 text-sm font-medium text-black bg-white rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition border border-gray-300">انصراف</button><button type="submit" class="px-4 py-2 text-sm font-medium text-black bg-white rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition border border-gray-300">ذخیره</button></div></form></div>
    </div>

    <div id="confirm-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-[60] transition-opacity duration-300">
        <div class="modal-content bg-white rounded-xl shadow-xl p-6 w-full max-w-sm"><h3 class="text-lg font-bold">تایید عملیات</h3><p id="confirm-modal-text" class="text-sm text-gray-500 my-4"></p><div class="flex justify-end gap-3"><button id="confirm-cancel" class="px-4 py-2 text-sm font-medium text-black bg-white rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition border border-gray-300">انصراف</button><button id="confirm-accept" class="px-4 py-2 text-sm font-medium text-black bg-white rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition border border-gray-300">تایید</button></div></div>
    </div>
    
    <div id="payment-profiles-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 transition-opacity duration-300">
        <div class="modal-content bg-white rounded-xl shadow-xl p-6 w-full max-w-lg flex flex-col" style="height: 80vh;">
            <h3 class="text-lg font-bold mb-4 flex-shrink-0">مدیریت پروفایل‌های پرداخت</h3>
            
            <form id="payment-profile-form" class="mb-4 p-4 border rounded-lg bg-gray-50 flex-shrink-0">
                <input type="hidden" id="payment-profile-id">
                <h4 id="payment-form-title" class="text-md font-semibold mb-3">افزودن پروفایل جدید</h4>
                <div class="grid grid-cols-2 gap-4">
                     <div><label for="profile-name" class="block text-sm font-medium text-gray-700 mb-1">نام پروفایل</label><input type="text" id="profile-name" required placeholder="مثال: حساب شخصی" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg"></div>
                     <div><label for="profile-holder-name" class="block text-sm font-medium text-gray-700 mb-1">نام صاحب حساب</label><input type="text" id="profile-holder-name" required class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg"></div>
                     <div><label for="profile-iban" class="block text-sm font-medium text-gray-700 mb-1">شماره شبا</label><input type="text" id="profile-iban" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg"></div>
                     <div><label for="profile-card" class="block text-sm font-medium text-gray-700 mb-1">شماره کارت</label><input type="text" id="profile-card" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg"></div>
                     <div class="col-span-2"><label for="profile-phone" class="block text-sm font-medium text-gray-700 mb-1">شماره تلفن</label><input type="text" id="profile-phone" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg"></div>
                </div>
                 <div class="mt-4 flex justify-end gap-3">
                    <button type="button" id="cancel-payment-profile-edit-btn" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-200 hover:bg-gray-300 rounded-lg">انصراف</button>
                    <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg">ذخیره پروفایل</button>
                 </div>
            </form>

            <div id="payment-profiles-list-container" class="flex-1 overflow-y-auto border-t pt-4">
            </div>

            <div class="mt-6 flex justify-end gap-3 flex-shrink-0">
                <button type="button" id="close-payment-profiles-modal-btn" class="px-4 py-2 text-sm font-medium text-black bg-white rounded-lg hover:bg-gray-100 border border-gray-300">بستن</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-5 right-5 z-[70] space-y-3"></div>

<script type="module">
// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
// App Initialization & DOM Elements
// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

const dom = {
    app: document.getElementById('app'),
    employersList: document.getElementById('employers-list'),
    addEmployerBtn: document.getElementById('add-employer-btn'),
    activeEmployerHeader: document.getElementById('active-employer-header'),
    itemsList: document.getElementById('items-list'),
    emptyState: document.getElementById('empty-state'),
    itemForm: document.getElementById('item-form'),
    summaryCard: document.getElementById('summary-card'),
    exportExcelBtn: document.getElementById('export-excel-btn'),
    exportHtmlBtn: document.getElementById('export-html-btn'),
    deleteAllDataBtn: document.getElementById('delete-all-data-btn'),
    backupDataBtn: document.getElementById('backup-data-btn'),
    restoreDataInput: document.getElementById('restore-data-input'),
    mergeDataCheckbox: document.getElementById('merge-data-checkbox'),

    // Modals & Toasts
    employerModal: document.getElementById('employer-modal'),
    employerModalTitle: document.getElementById('employer-modal-title'),
    employerForm: document.getElementById('employer-form'),
    employerIdInput: document.getElementById('employer-id'),
    employerNameInput: document.getElementById('employer-name'),
    cancelEmployerModalBtn: document.getElementById('cancel-employer-modal'),
    confirmModal: document.getElementById('confirm-modal'),
    confirmModalText: document.getElementById('confirm-modal-text'),
    confirmCancelBtn: document.getElementById('confirm-cancel'),
    confirmAcceptBtn: document.getElementById('confirm-accept'),
    toastContainer: document.getElementById('toast-container'),

    // Item Form elements
    editItemIdInput: document.getElementById('edit-item-id'),
    itemNameInput: document.getElementById('item-name'),
    itemAmountInput: document.getElementById('item-amount'),
    itemTypeInput: document.getElementById('item-type'),
    itemSubmitBtn: document.getElementById('item-submit-btn'),
    cancelEditBtn: document.getElementById('cancel-edit-btn'),
    
    // Payment Profile elements
    managePaymentProfilesBtn: document.getElementById('manage-payment-profiles-btn'),
    paymentProfileSelect: document.getElementById('payment-profile-select'),
    paymentProfilesModal: document.getElementById('payment-profiles-modal'),
    closePaymentProfilesModalBtn: document.getElementById('close-payment-profiles-modal-btn'),
    paymentProfileForm: document.getElementById('payment-profile-form'),
    paymentFormTitle: document.getElementById('payment-form-title'),
    paymentProfileIdInput: document.getElementById('payment-profile-id'),
    profileNameInput: document.getElementById('profile-name'),
    profileHolderNameInput: document.getElementById('profile-holder-name'),
    profileIbanInput: document.getElementById('profile-iban'),
    profileCardInput: document.getElementById('profile-card'),
    profilePhoneInput: document.getElementById('profile-phone'),
    cancelPaymentProfileEditBtn: document.getElementById('cancel-payment-profile-edit-btn'),
    paymentProfilesListContainer: document.getElementById('payment-profiles-list-container'),
};

let state = {};
let confirmCallback = null; // To store the action for the confirmation modal

document.addEventListener('DOMContentLoaded', async () => {
    await loadState();
    initializeApp();
    setupEventListeners();
});

function initializeApp() {
    if (!state.employers || state.employers.length === 0) {
        showWelcomeState();
    } else {
        if (!state.activeEmployerId || !state.employers.find(e => e.id === state.activeEmployerId)) {
            state.activeEmployerId = state.employers.length > 0 ? state.employers[0].id : null;
        }
    }
    render();
}

function showWelcomeState() {
    dom.activeEmployerHeader.innerHTML = `<h2 class="text-xl font-bold">خوش آمدید</h2>`;
    dom.itemsList.innerHTML = '';
    dom.emptyState.classList.remove('hidden');
    dom.summaryCard.innerHTML = '<p class="text-sm text-gray-500">برای شروع یک کارفرما اضافه کنید.</p>';
    dom.exportExcelBtn.disabled = true;
    dom.exportHtmlBtn.disabled = true;
}

// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
// State Management & Persistence (localForage)
// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

const defaultState = {
    employers: [],
    settings: {
        currency: 'IRR',
        supervisionPercent: 0.15,
        supervisionBase: 'received',
        paymentProfiles: [],
        selectedPaymentProfileId: null
    },
    activeEmployerId: null,
};

async function loadState() {
    const savedState = await localforage.getItem('invoiceManagerData');
    state = savedState ? { ...defaultState, ...savedState, settings: {...defaultState.settings, ...(savedState?.settings || {})} } : { ...defaultState };

    if (state.employers) {
        state.employers.forEach(emp => {
            if (emp.supervisionPercent === undefined) emp.supervisionPercent = defaultState.settings.supervisionPercent;
            if (emp.supervisionBase === undefined) emp.supervisionBase = defaultState.settings.supervisionBase;
        });
    }
}

async function saveState() {
    await localforage.setItem('invoiceManagerData', state);
}

// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
// Rendering Functions
// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

function render() {
    if (!state.employers || state.employers.length === 0) {
        showWelcomeState();
        renderEmployersList();
    } else {
        renderEmployersList();
        const activeEmployer = getActiveEmployer();
        if (activeEmployer) {
            renderActiveEmployerHeader(activeEmployer);
            renderItemsList(activeEmployer.items);
            renderSummary(activeEmployer);
            dom.exportExcelBtn.disabled = false;
            dom.exportHtmlBtn.disabled = false;
        } else {
            showWelcomeState();
        }
    }
    renderPaymentProfileSelector();
    saveState();
}

function renderEmployersList() {
    dom.employersList.innerHTML = state.employers.map(employer => `
        <a href="#" data-id="${employer.id}" class="employer-link group flex items-center justify-between px-3 py-2.5 text-sm font-medium rounded-lg transition-colors ${state.activeEmployerId === employer.id ? 'bg-gray-100 text-gray-900' : 'text-gray-600 hover:bg-gray-50'}">
            <span>${employer.name}</span>
            <span class="flex items-center gap-2">
                <button data-action="edit-employer" data-employer-id="${employer.id}" class="p-1 opacity-0 group-hover:opacity-100 text-gray-400 hover:text-blue-500 transition-opacity" title="ویرایش کارفرما"><i class="fas fa-edit"></i></button>
                <button data-action="delete-employer" data-employer-id="${employer.id}" class="p-1 opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-500 transition-opacity" title="حذف کارفرما"><i class="fas fa-trash"></i></button>
            </span>
        </a>`).join('');
}

function renderActiveEmployerHeader(employer) {

function handleItemFormSubmit(e) {

    if (!name || isNaN(amount) || amount <= 0) { showToast('لطفا نام و مبلغ معتبر وارد کنید.', 'destructive'); return; }
    if (itemId) {

function handleAmountInputFormatting(e) {
    const input = e.target;
    let value = input.value;
    
    if (value.trim() === '') {
        input.value = '';
        return;
    }

    const p2e = { '۰': '0', '۱': '1', '۲': '2', '۳': '3', '۴': '4', '۵': '5', '۶': '6', '۷': '7', '۸': '8', '۹': '9' };
    const a2e = { '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4', '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9' };

    const latinNumerals = value.split('').map(char => p2e[char] || a2e[char] || char).join('').replace(/[^0-9]/g, '');

    if (latinNumerals === '') {
        input.value = '';
        return;
    }

    try {
        const formattedValue = new Intl.NumberFormat('en-US').format(BigInt(latinNumerals));
        if (input.value !== formattedValue) {
            input.value = formattedValue;
        }
    } catch (error) {
        input.value = latinNumerals; 
    }
}

function handleEmployerFormSubmit(e) {
    e.preventDefault();
    const name = dom.employerNameInput.value.trim();
    if (!name) return;
    const employerId = dom.employerIdInput.value;
    if (employerId) {
        const employer = state.employers.find(emp => emp.id === employerId);
        if (employer) { employer.name = name; showToast('نام کارفرما با موفقیت بروزرسانی شد.'); }
    } else {
        const newEmployer = { id: generateId(), name, items: [], supervisionPercent: state.settings.supervisionPercent, supervisionBase: state.settings.supervisionBase };
        state.employers.push(newEmployer);
        state.activeEmployerId = newEmployer.id;
        showToast('کارفرما با موفقیت اضافه شد.');
    }
    closeEmployerModal();
    render();
}

function handleEmployerActions(e) {
    const link = e.target.closest('.employer-link');
    const deleteBtn = e.target.closest('[data-action="delete-employer"]');
    const editBtn = e.target.closest('[data-action="edit-employer"]');
    if (deleteBtn) {
        e.preventDefault(); e.stopPropagation();
        const employerId = deleteBtn.dataset.employerId;
        const employer = state.employers.find(emp => emp.id === employerId);
        openConfirmModal(`آیا از حذف کارفرمای "${employer.name}" و تمام آیتم‌های آن مطمئن هستید؟`, () => {
            state.employers = state.employers.filter(emp => emp.id !== employerId);
            if (state.activeEmployerId === employerId) { state.activeEmployerId = state.employers.length > 0 ? state.employers[0].id : null; }
            render();
            showToast('کارفرما حذف شد.', 'destructive');
        });
    } else if (editBtn) {
        e.preventDefault(); e.stopPropagation();
        const employerId = editBtn.dataset.employerId;
        const employer = state.employers.find(emp => emp.id === employerId);
        if (employer) openEmployerModal(employer);
    } else if (link) {
        e.preventDefault();
        state.activeEmployerId = link.dataset.id;
        render();
    }
}

async function handleItemActions(e) {
    const actionElement = e.target.closest('[data-action]');
    if (!actionElement) return;
    const itemRow = actionElement.closest('.item-row');
    const itemId = itemRow?.dataset.id;
    const employer = getActiveEmployer();
    const item = employer?.items.find(i => i.id === itemId);
    if (!item) return;
    switch (actionElement.dataset.action) {
        case 'edit-item': handleEditItem(item); break;
        case 'delete-item':
            openConfirmModal(`آیا از حذف آیتم "${item.name}" مطمئن هستید؟`, () => {
                employer.items = employer.items.filter(i => i.id !== itemId);
                render();
                showToast('آیتم حذف شد.', 'destructive');
            });
            break;
        case 'toggle-parent': item.isParent = e.target.checked; saveState(); break;
        case 'upload-attachment': await handleFileUpload(e.target.files[0], item); break;
        case 'preview-attachment': previewAttachment(item.attachment); break;
        case 'delete-attachment':
            openConfirmModal(`آیا از حذف پیوست "${item.attachment.filename}" مطمئن هستید؟`, () => {
                item.attachment = null;
                render();
                showToast('پیوست با موفقیت حذف شد.');
            });
            break;
    }
}

async function handleFileUpload(file, item) {
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) { showToast('حجم فایل نباید بیشتر از ۱۰ مگابایت باشد.', 'destructive'); return; }
    try {
        const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
        item.attachment = { filename: file.name, type: file.type, dataUrl: dataUrl };
        render();
        showToast('فایل با موفقیت بارگذاری شد.');
    } catch (error) { console.error("File read error:", error); showToast("خطا در بارگذاری فایل.", 'destructive'); }
}

function handleSettingsChange(e) {
    const activeEmployer = getActiveEmployer();
    if (!activeEmployer) return;
    const t = e.target;
    if (t.id === 'supervision-percent') {
        const p = parseFloat(t.value);
        if (!isNaN(p) && p >= 0) activeEmployer.supervisionPercent = p / 100;
    } else if (t.matches('.supervision-base-toggle')) {
        activeEmployer.supervisionBase = t.dataset.value;
    }
    render();
}

function handleDeleteAllData() { openConfirmModal("این عمل تمام داده‌ها را پاک می‌کند. آیا مطمئن هستید؟", () => { localforage.clear().then(() => { state = JSON.parse(JSON.stringify(defaultState)); initializeApp(); showToast('تمام داده‌ها پاک شد.', 'destructive'); }); }); }
function handleExportExcel() { const e = getActiveEmployer(); if (e) exportToExcel(e); }
function handleExportHTMLZip() { const e = getActiveEmployer(); if (e) exportToHTMLZip(e); }
const getActiveEmployer = () => state.employers.find(e => e.id === state.activeEmployerId);
function calculateSummary(employer) {
    const items = employer.items || [];
    const totalExpenses = items.filter(i => i.type === 'expense').reduce((s, i) => s + i.amount, 0);
    const totalReceived = items.filter(i => i.type === 'received').reduce((s, i) => s + i.amount, 0);
    const supervisionPercent = employer.supervisionPercent ?? defaultState.settings.supervisionPercent;
    const supervisionBase = employer.supervisionBase ?? defaultState.settings.supervisionBase;
    const baseValue = supervisionBase === 'received' ? totalReceived : totalExpenses;
    const supervisionFee = Math.round(baseValue * supervisionPercent);
    const netBalance = totalReceived - totalExpenses - supervisionFee;
    return { totalExpenses, totalReceived, supervisionFee, netBalance };
}
function normalizePersianNumber(str) {
    if (typeof str !== 'string' || !str) return NaN;
    const p2e = { '۰': '0', '۱': '1', '۲': '2', '۳': '3', '۴': '4', '۵': '5', '۶': '6', '۷': '7', '۸': '8', '۹': '9' };
    const a2e = { '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4', '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9' };
    const sanitized = String(str).replace(/[^۰-۹٠-٩0-9]/g, '');
    const latin = sanitized.split('').map(char => p2e[char] || a2e[char] || char).join('');
    return latin === '' ? NaN : parseFloat(latin);
}
function formatCurrency(num) { return new Intl.NumberFormat('fa-IR').format(num) + ' ریال'; }
function previewAttachment(attachment) { const blob = base64ToBlob(attachment.dataUrl.split(',')[1], attachment.type); const url = URL.createObjectURL(blob); window.open(url, '_blank'); }
function openEmployerModal(employer = null) {
    dom.employerForm.reset();
    if (employer) {
        dom.employerModalTitle.textContent = 'ویرایش کارفرما';
        dom.employerNameInput.value = employer.name;
        dom.employerIdInput.value = employer.id;
    } else {
        dom.employerModalTitle.textContent = 'افزودن کارفرما';
        dom.employerIdInput.value = '';
    }
    dom.employerModal.classList.remove('hidden');
    dom.employerModal.classList.add('flex');
    dom.employerNameInput.focus();
}
function closeEmployerModal() { dom.employerModal.classList.add('hidden'); dom.employerModal.classList.remove('flex'); dom.employerIdInput.value = ''; }
function openConfirmModal(message, onConfirm) { dom.confirmModalText.textContent = message; confirmCallback = onConfirm; dom.confirmModal.classList.remove('hidden'); dom.confirmModal.classList.add('flex'); }
function closeConfirmModal() { dom.confirmModal.classList.add('hidden'); dom.confirmModal.classList.remove('flex'); confirmCallback = null; }
function showToast(message, type = 'success') {
    const toast = document.createElement('div');
    const isDestructive = type === 'destructive';
    const icon = isDestructive ? '<i class="fas fa-times-circle"></i>' : '<i class="fas fa-check-circle"></i>';
    toast.className = `toast flex items-center w-full max-w-xs p-4 space-x-4 rtl:space-x-reverse rounded-xl shadow-lg transition-all duration-300 ${isDestructive ? 'bg-red-50 text-red-700' : 'bg-white text-gray-500'}`;
    toast.innerHTML = `<div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-lg ${isDestructive ? 'text-red-500 bg-red-100' : 'text-green-500 bg-green-100'} rounded-lg">${icon}</div><div class="ms-3 text-sm font-normal">${message}</div>`;
    dom.toastContainer.appendChild(toast);
    setTimeout(() => { toast.classList.add('fade-out'); toast.addEventListener('animationend', () => toast.remove()); }, 3000);
}
const generateId = () => `id_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
const base64ToBlob = (base64, mimeType) => { const byteCharacters = atob(base64); const byteNumbers = new Array(byteCharacters.length); for (let i = 0; i < byteCharacters.length; i++) { byteNumbers[i] = byteCharacters.charCodeAt(i); } const byteArray = new Uint8Array(byteNumbers); return new Blob([byteArray], { type: mimeType }); };

// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
// Backup & Restore Functions
// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
function handleBackup() {
    try {
        const dataStr = JSON.stringify(state, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const timestamp = new Date().toISOString().slice(0, 19).replace(/[-T:]/g, "");
        link.download = `factor-manager-backup-${timestamp}.json`;
        link.href = url;
        link.click();
        URL.revokeObjectURL(url);
        showToast('فایل پشتیبان با موفقیت ایجاد شد.');
    } catch (error) {
        console.error("Backup failed:", error);
        showToast('خطا در ایجاد فایل پشتیبان.', 'destructive');
    }
}

function handleRestore(e) {
    const file = e.target.files[0];
    if (!file) return;

    const shouldMerge = dom.mergeDataCheckbox.checked;
    const confirmationMessage = shouldMerge 
        ? 'اطلاعات فایل پشتیبان با اطلاعات فعلی ادغام خواهد شد. داده‌های مشابه (بر اساس شناسه) بروزرسانی می‌شوند. آیا ادامه می‌دهید؟'
        : 'وارد کردن فایل پشتیبان تمام اطلاعات فعلی را پاک کرده و اطلاعات جدید را جایگزین می‌کند. آیا مطمئن هستید؟';
    
    openConfirmModal(confirmationMessage, () => {
        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const importedState = JSON.parse(event.target.result);
                if (!importedState || typeof importedState.employers === 'undefined' || typeof importedState.settings === 'undefined') {
                    throw new Error('Invalid backup file format.');
                }
                
                if (shouldMerge) {
                    // Perform merge
                    importedState.employers.forEach(importedEmployer => {
                        const existingEmployer = state.employers.find(e => e.id === importedEmployer.id);
                        if (existingEmployer) {
                            importedEmployer.items.forEach(importedItem => {
                                const existingItemIndex = existingEmployer.items.findIndex(i => i.id === importedItem.id);
                                if (existingItemIndex > -1) {
                                    existingEmployer.items[existingItemIndex] = importedItem;
                                } else {
                                    existingEmployer.items.push(importedItem);
                                }
                            });
                            existingEmployer.name = importedEmployer.name;
                            existingEmployer.supervisionPercent = importedEmployer.supervisionPercent;
                            existingEmployer.supervisionBase = importedEmployer.supervisionBase;
                        } else {
                            state.employers.push(importedEmployer);
                        }
                    });

                    if (!state.settings.paymentProfiles) state.settings.paymentProfiles = [];
                    importedState.settings.paymentProfiles.forEach(importedProfile => {
                        const existingProfileIndex = state.settings.paymentProfiles.findIndex(p => p.id === importedProfile.id);
                        if (existingProfileIndex > -1) {
                            state.settings.paymentProfiles[existingProfileIndex] = importedProfile;
                        } else {
                            state.settings.paymentProfiles.push(importedProfile);
                        }
                    });
                    
                    state.settings.selectedPaymentProfileId = importedState.settings.selectedPaymentProfileId || state.settings.selectedPaymentProfileId;
                    state.settings.currency = importedState.settings.currency || state.settings.currency;
                    
                    showToast('اطلاعات با موفقیت ادغام شد.');
                    saveState().then(() => render());
                    
                } else {
                    // Overwrite
                    state = importedState;
                    state.settings = {...defaultState.settings, ...state.settings};
                    saveState().then(() => {
                        showToast('اطلاعات با موفقیت بازیابی شد. صفحه مجددا بارگذاری می‌شود.');
                        setTimeout(() => location.reload(), 1500);
                    });
                }

            } catch (error) {
                console.error('Restore failed:', error);
                showToast('فایل پشتیبان نامعتبر است یا در خواندن آن خطا رخ داده.', 'destructive');
            } finally {
                e.target.value = null; // Reset file input
            }
        };
        reader.onerror = () => {
             showToast('خطا در خواندن فایل.', 'destructive');
             e.target.value = null;
        }
        reader.readAsText(file);
    });
}

function exportToExcel(employer) {
    const data = [[`فاکتور ${employer.name}`], [], ['عنوان', '', '', '', '', '', 'مبلغ']];
    const formatNumber = (num) => new Intl.NumberFormat('en-US').format(num);
    employer.items.forEach(item => data.push([item.name, null, null, null, null, null, formatNumber(item.amount)]));
    const summary = calculateSummary(employer);
    const supervisionBaseText = (employer.supervisionBase || 'received') === 'received' ? 'دریافتی' : 'خرج کرد';
    const isDebtor = summary.netBalance < 0;
    const balanceStatusText = isDebtor ? 'بدهکار' : 'بستانکار';
    const balanceAmount = formatNumber(Math.abs(summary.netBalance));
    data.push([], [null, null, null, null, null, 'جمع خرج کرد', formatNumber(summary.totalExpenses)], [null, null, null, null, null, 'جمع دریافتی', formatNumber(summary.totalReceived)], [null, null, null, null, null, `مبلغ نظارت (${(employer.supervisionPercent || 0) * 100}% از ${supervisionBaseText})`, formatNumber(summary.supervisionFee)], [], [null, null, null, null, null, balanceStatusText, balanceAmount]);
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws['!RTL'] = true;
    if (!ws['!merges']) ws['!merges'] = [];
    ws['!merges'].push({ s: { r: 0, c: 0 }, e: { r: 0, c: 6 } });
    ws['!cols'] = [ { wch: 50 }, { wch: 8 }, { wch: 8 }, { wch: 8 }, { wch: 8 }, { wch: 8 }, { wch: 20 } ];
    if(ws['A1']) ws['A1'].s = { font: { sz: 16, bold: true }, alignment: { horizontal: "center", vertical: "center" } };
    const headerStyle = { font: { bold: true }, alignment: { horizontal: "center" } };
    if(ws['A3']) ws['A3'].s = headerStyle;
    if(ws['G3']) ws['G3'].s = headerStyle;
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "فاکتور");
    XLSX.writeFile(wb, `فاکتور-${employer.name}.xlsx`);
}
